sonar.projectKey=jeremykenedy_aquarium-live
sonar.organization=jeremykenedy-12345

sonar.sources=src
sonar.tests=test
sonar.java.source=8
sonar.java.binaries=build/classes
sonar.java.test.binaries=build/test-classes
sonar.coverage.jacoco.xmlReportPaths=build/jacoco.xml

# These classes call Android (Canvas painting, OpenGL ES, activities and the
# screensaver service), so they cannot run on the plain JVM the tests use.
# They are checked on devices instead; see docs/TESTING.md. Every class that
# can run on a plain JVM is measured and held at 100%.
sonar.coverage.exclusions=\
  src/com/jeremykenedy/aquariumlive/AquariumDream.java,\
  src/com/jeremykenedy/aquariumlive/AquariumRenderer.java,\
  src/com/jeremykenedy/aquariumlive/AquariumView.java,\
  src/com/jeremykenedy/aquariumlive/ArtStyle.java,\
  src/com/jeremykenedy/aquariumlive/CreatureArt.java,\
  src/com/jeremykenedy/aquariumlive/FishArt.java,\
  src/com/jeremykenedy/aquariumlive/Gl.java,\
  src/com/jeremykenedy/aquariumlive/PlantArt.java,\
  src/com/jeremykenedy/aquariumlive/PreviewActivity.java,\
  src/com/jeremykenedy/aquariumlive/SettingsActivity.java,\
  src/com/jeremykenedy/aquariumlive/Textures.java
