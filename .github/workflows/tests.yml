name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Simulation tests (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - run: ./test.sh

  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Build and sign with a throwaway key
        run: ./build.sh
      - name: Confirm the APK asks for no permissions
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          if "$AAPT" dump permissions build/aquarium-live.apk | grep -q "uses-permission"; then
            echo "The APK requests a permission. Aquarium Live must not request any."
            "$AAPT" dump permissions build/aquarium-live.apk
            exit 1
          fi
