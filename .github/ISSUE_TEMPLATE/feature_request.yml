name: Feature request
description: Suggest a new scene, creature, look or setting.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The scene, creature, look or setting, and what it should do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do that you cannot do now.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Pictures or links that show what you have in mind, if any.
